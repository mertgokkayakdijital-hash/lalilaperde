<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Giriş | Lalila Perde Sistemleri</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container" style="padding-top: 120px; padding-bottom: 80px; max-width: 460px;">
    <h1 class="section-title" style="text-align: left; font-size: 2rem;">Admin Girişi</h1>
    <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
      <input type="email" name="email" placeholder="E-posta" required style="padding: 12px; border: 1px solid #ccc; border-radius: 4px;">
      <input type="password" name="password" placeholder="Şifre" required style="padding: 12px; border: 1px solid #ccc; border-radius: 4px;">
      <button type="submit" class="cta-btn" style="border: none; cursor: pointer;">Giriş Yap</button>
    <p id="loginError" style="color:#b00020;font-size:.875rem;min-height:1.2em;"></p>
    </form>
  </main>
  <script type="module" src="/js/admin-login.js"></script>
</body>
</html>
