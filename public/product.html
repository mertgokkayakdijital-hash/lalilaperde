<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Detayı | Lalila Perde Sistemleri</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container" style="padding-top: 120px; padding-bottom: 80px;">
    <a href="/catalog" style="display: inline-block; margin-bottom: 24px; color: var(--text-primary);">← Kataloğa Dön</a>
    <h1 class="section-title" id="productTitle" style="text-align: left; margin-bottom: 12px;">Ürün</h1>
    <p class="section-subtitle" id="productDesc" style="text-align: left;"></p>
    <p id="productMeta" style="margin-top:16px;color:var(--text-secondary);"></p>
    <button type="button" class="fav-toggle-btn" id="productFav" style="margin-top:24px;background:none;border:1px solid rgba(28,28,28,0.15);padding:8px 12px;border-radius:4px;cursor:pointer;">🤍 Favori</button>
  </main>
  <script>
    const PRODUCTS = {
      "tul-keten-01": { name: "Linen Breeze Keten Tül", cat: "Tül Perde", light: "Yüksek ışık (şeffaf)", desc: "Doğal keten dokulu, gün ışığını yumuşakça içeri alan zarif tül." },
      "motorlu-somfy-02": { name: "Sessiz Motorlu Karartma", cat: "Motorlu Sistem", light: "Tam karartma", desc: "Uzaktan kumanda ve zamanlayıcı uyumlu, sessiz ray mekanizması." },
      "fon-kadife-03": { name: "Velvet Aura Fon Perde", cat: "Fon Perde", light: "Yarı karartma", desc: "Yarı karartma dokusu ve tok duruşuyla salonlara derinlik katar." }
    };
    const id = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
    const p = PRODUCTS[id];
    document.getElementById("productTitle").textContent = p ? p.name : "Ürün bulunamadı";
    document.getElementById("productDesc").textContent = p ? p.desc : "Bu ürün kataloğumuzda yer almıyor.";
    document.getElementById("productMeta").textContent = p ? p.cat + " • " + p.light + " • Ürün kodu: " + id : "";
    const fav = document.getElementById("productFav");
    if (p) fav.setAttribute("data-fav-id", id); else fav.style.display = "none";
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
